name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      - name: Run tests
        env:
          SKIP_AZURE_TESTS: 1
        run: make test

      - name: Build
        run: make build

      - name: Check version detection
        run: make version

      # Smoke-test de COMPILAÇÃO apenas (roda em ubuntu-latest, sem toolchain C pra macOS) — não
      # valida que os binários darwin funcionam de verdade em runtime. `make release` cross-
      # compila com CGO_ENABLED=0 pra darwin aqui, então o driver SQLite cai num stub que compila
      # normalmente mas quebra toda a persistência (ver internal/storage/sqlite_health.go). A
      # release de verdade (workflow release.yml) builda macOS em runners nativos com CGO real e
      # tem um smoke-test específico pra pegar essa regressão antes de publicar.
      - name: Test cross-compilation (compile-only, não valida CGO/SQLite em darwin)
        run: make release

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: new-k8s-hpa-dev
          path: build/new-k8s-hpa
          retention-days: 7
