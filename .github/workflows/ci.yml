name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

# Um push novo na mesma branch/PR cancela a execução anterior (a CI é a parte lenta do fluxo).
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # ─── Backend: testes com race detector, build e smoke-test de cross-compilação ───
  backend:
    name: Backend (go test -race + build)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/go-build
            ~/go/pkg/mod
          key: ${{ runner.os }}-go-${{ hashFiles('**/go.sum') }}
          restore-keys: |
            ${{ runner.os }}-go-

      - name: Download dependencies
        run: go mod download

      - name: Verify dependencies
        run: go mod verify

      # -race exige CGO (o ubuntu-latest já traz gcc). Baseline medido: 0 falhas, 0 data races.
      # Sem az CLI autenticado, o make target liga SKIP_AZURE_TESTS.
      - name: Run tests (race detector)
        run: make test-race

      - name: Build
        run: make build

      - name: Check version detection
        run: make version

      # Smoke-test de COMPILAÇÃO apenas (roda em ubuntu-latest, sem toolchain C pra macOS) — não
      # valida que os binários darwin funcionam de verdade em runtime. `make release` cross-
      # compila com CGO_ENABLED=0 pra darwin aqui, então o driver SQLite cai num stub que compila
      # normalmente mas quebra toda a persistência (ver internal/storage/sqlite_health.go). A
      # release de verdade (workflow release.yml) builda macOS em runners nativos com CGO real e
      # tem um smoke-test específico pra pegar essa regressão antes de publicar.
      - name: Test cross-compilation (compile-only, não valida CGO/SQLite em darwin)
        run: make release

      # Só guarda o binário para conferência manual: se a cota de artefatos do repositório estourar, o upload não
      # pode reprovar a CI (build e testes já passaram).
      - name: Upload build artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: new-k8s-hpa-dev
          path: build/new-k8s-hpa
          retention-days: 1

  # ─── Frontend: type-check REAL ───
  # `vite build` não checa tipos, e `tsc -p .` (tsconfig raiz "solution") sempre passa: o comando
  # válido é -p tsconfig.app.json. Baseline medido: 0 erros (com strict: false).
  web-typecheck:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: internal/web/frontend
        run: npm ci

      - name: Type-check
        run: make web-typecheck

  # ─── Frontend: testes (Vitest) ───
  # Só a lógica pura (funções sem DOM): mesclagem/persistência da busca na subscription, destino dos
  # links de Dependencies, destinatários do Teams, normalização do endpoint do apiClient, build id.
  web-test:
    name: Frontend (vitest)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: internal/web/frontend
        run: npm ci

      - name: Test
        run: make web-test

  # ─── Frontend: eslint ───
  # Bloqueia. Baseline: 0 erros. no-explicit-any está como aviso (323 usos = dívida de tipagem),
  # então só erro novo de verdade reprova.
  web-lint:
    name: Frontend (eslint)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: internal/web/frontend/package-lock.json

      - name: Install dependencies
        working-directory: internal/web/frontend
        run: npm ci

      - name: Lint
        run: make web-lint

      # Aviso por enquanto (ajuda sendo escrita aba por aba): lista as abas sem página. Já reprova se
      # o registro e os arquivos de help/pages divergirem. Virar `--strict` quando todas existirem.
      - name: Cobertura da ajuda
        run: make web-help-check
