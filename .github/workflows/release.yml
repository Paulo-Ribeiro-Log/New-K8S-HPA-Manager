name: Release

# Disparo manual apenas (workflow_dispatch) — NÃO dispara automaticamente em push de tag.
# Motivo: o fluxo de release documentado no CLAUDE.md (seção "Release") é manual via
# `git tag vX.Y.Z && git push origin vX.Y.Z` seguido de `gh release create` explícito.
# Um trigger automático em `push: tags: v*` corria em paralelo a esse fluxo manual e
# publicava uma release duplicada/com nomes de binário desatualizados.
# Para rodar: Actions → Release → Run workflow, escolhendo a tag desejada como "Use workflow from".
on:
  workflow_dispatch: {}

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Necessário para git describe

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "ERRO: rode este workflow escolhendo uma tag vX.Y.Z em 'Use workflow from', não uma branch." >&2
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

      - name: Build frontend
        run: |
          cd internal/web/frontend
          npm ci
          npm run build

      - name: Verify static files exist
        run: |
          echo "=== Checking static files ==="
          ls -lah internal/web/static/
          ls -lah internal/web/static/assets/
          echo "=== Static files verified ==="

      - name: Build binaries for all platforms
        run: make release

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🚀 new-k8s-hpa ${{ steps.version.outputs.VERSION }}

            ### 📥 Instalação

            **Linux (amd64):**
            ```bash
            curl -L https://github.com/Paulo-Ribeiro-Log/New-K8S-HPA-Manager/releases/download/v${{ steps.version.outputs.VERSION }}/new-k8s-hpa-linux-amd64 -o new-k8s-hpa
            chmod +x new-k8s-hpa
            sudo mv new-k8s-hpa /usr/local/bin/
            ```

            **macOS (Intel):**
            ```bash
            curl -L https://github.com/Paulo-Ribeiro-Log/New-K8S-HPA-Manager/releases/download/v${{ steps.version.outputs.VERSION }}/new-k8s-hpa-darwin-amd64 -o new-k8s-hpa
            chmod +x new-k8s-hpa
            sudo mv new-k8s-hpa /usr/local/bin/
            ```

            **macOS (Apple Silicon):**
            ```bash
            curl -L https://github.com/Paulo-Ribeiro-Log/New-K8S-HPA-Manager/releases/download/v${{ steps.version.outputs.VERSION }}/new-k8s-hpa-darwin-arm64 -o new-k8s-hpa
            chmod +x new-k8s-hpa
            sudo mv new-k8s-hpa /usr/local/bin/
            ```

            **Windows**: Use WSL2 com o binário Linux.

            ### ✨ Verificar Instalação
            ```bash
            new-k8s-hpa version
            ```

            ---

            🤖 Release publicada manualmente via GitHub Actions (workflow_dispatch)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: new-k8s-hpa-${{ steps.version.outputs.VERSION }}
          path: build/release/*
          retention-days: 90
