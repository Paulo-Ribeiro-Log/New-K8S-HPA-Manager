name: Release

# Disparo manual apenas (workflow_dispatch) — NÃO dispara automaticamente em push de tag.
# Este workflow é o fluxo oficial de release (ver docs/guides/DEVELOPMENT_COMMANDS.md):
# `git tag vX.Y.Z && git push origin vX.Y.Z` e depois disparar este workflow na tag —
# ele compila os binários e cria a release no GitHub.
# SEM artefatos do Actions: a cota de armazenamento de artefatos da conta estourou e derrubava o
# release. Em vez de passar arquivos entre jobs, o job `create-release` abre a release como
# rascunho, cada job de build anexa o próprio binário nela (`gh release upload`) e o job
# `publish` tira o rascunho no fim. Cada build compila o frontend sozinho (go:embed).
# Motivo do disparo manual: um trigger automático em `push: tags: v*` já correu em paralelo
# a uma publicação manual e gerou release duplicada/com nomes de binário desatualizados.
# Para rodar: Actions → Release → Run workflow, escolhendo a tag desejada como "Use workflow from"
# (ou `gh workflow run release.yml --ref vX.Y.Z`).
on:
  workflow_dispatch: {}

jobs:
  # Valida a tag e expõe a versão limpa (sem "v") pros demais jobs via output.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "ERRO: rode este workflow escolhendo uma tag vX.Y.Z em 'Use workflow from', não uma branch." >&2
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # Abre a release como RASCUNHO (invisível até o publish) com o texto de instalação. Se sobrou um
  # rascunho de uma tentativa que falhou, recria; release já publicada nunca é sobrescrita.
  create-release:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Criar release em rascunho
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            if [ "$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json isDraft --jq .isDraft)" != "true" ]; then
              echo "ERRO: a release $TAG já está publicada; não vou sobrescrever." >&2
              exit 1
            fi
            gh release delete "$TAG" --repo "$GITHUB_REPOSITORY" --yes
          fi
          BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${TAG}"
          cat > notes.md <<EOF
          ## 🚀 new-k8s-hpa ${TAG#v}

          ### 📥 Instalação

          **Linux (amd64):**
          \`\`\`bash
          curl -L ${BASE}/new-k8s-hpa-linux-amd64 -o new-k8s-hpa
          chmod +x new-k8s-hpa
          sudo mv new-k8s-hpa /usr/local/bin/
          \`\`\`

          **macOS (Intel):**
          \`\`\`bash
          curl -L ${BASE}/new-k8s-hpa-darwin-amd64 -o new-k8s-hpa
          chmod +x new-k8s-hpa
          sudo mv new-k8s-hpa /usr/local/bin/
          \`\`\`

          **macOS (Apple Silicon):**
          \`\`\`bash
          curl -L ${BASE}/new-k8s-hpa-darwin-arm64 -o new-k8s-hpa
          chmod +x new-k8s-hpa
          sudo mv new-k8s-hpa /usr/local/bin/
          \`\`\`

          **Windows**: Use WSL2 com o binário Linux.

          ### ✨ Verificar Instalação
          \`\`\`bash
          new-k8s-hpa version
          \`\`\`

          ---

          🤖 Release publicada manualmente via GitHub Actions (workflow_dispatch) — binários
          macOS buildados em runners macOS com CGO_ENABLED=1 real, garantindo que a persistência
          SQLite (Notas, tokens de IA/Dynatrace/GitHub, predictions, etc.) funciona de verdade.
          EOF
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag \
            --title "$TAG" --notes-file notes.md --generate-notes

  build-linux-amd64:
    needs: [version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para `git describe` (versão embutida no binário)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (embutido no binário via go:embed)
        run: |
          cd internal/web/frontend
          npm ci
          npm run build

      - name: Build (CGO_ENABLED=1, nativo)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: make release-single

      - name: Anexar binário à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.version.outputs.version }}" build/release/new-k8s-hpa-linux-amd64 --repo "$GITHUB_REPOSITORY" --clobber

  # Roda em macos-14 (Apple Silicon), NÃO macos-13 (Intel) — runners macos-13 do GitHub têm fila
  # historicamente longa/instável (confirmado na prática: job ficou >15min em "queued" sem nenhum
  # runner atribuído, `runner_id: 0`, enquanto macos-14 pegou runner em segundos). Em vez de
  # depender de um pool de runner escasso, cross-compila amd64 a partir do host arm64 usando o
  # clang universal do Xcode (`-arch x86_64` via CGO_CFLAGS/CGO_LDFLAGS) — o mesmo compilador que
  # a Apple usa pra gerar binários "Universal" nativamente suporta as duas arquiteturas Darwin.
  build-darwin-amd64:
    needs: [version, create-release]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (embutido no binário via go:embed)
        run: |
          cd internal/web/frontend
          npm ci
          npm run build

      - name: Build (CGO_ENABLED=1, cross-arch via clang universal do Xcode — corrige binário com SQLite quebrado)
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 1
          CGO_CFLAGS: -arch x86_64
          CGO_LDFLAGS: -arch x86_64
        run: make release-single

      - name: Instalar Rosetta 2 (necessário pra rodar o binário x86_64 no runner arm64 pro smoke-test)
        run: softwareupdate --install-rosetta --agree-to-license || true

      - name: Smoke-test SQLite real (não só compilação)
        run: |
          # Confirma que o driver SQLite funciona de verdade neste binário — é exatamente esta
          # checagem que faltava antes e deixou um release com persistência quebrada passar
          # despercebido (ver internal/storage/sqlite_health.go). Roda via Rosetta 2 (o runner é
          # arm64, o binário é x86_64).
          chmod +x build/release/new-k8s-hpa-darwin-amd64
          OUT=$(./build/release/new-k8s-hpa-darwin-amd64 version 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q "CGO_ENABLED=0"; then
            echo "❌ Binário compilado sem CGO real — SQLite quebrado. Abortando release." >&2
            exit 1
          fi
          file build/release/new-k8s-hpa-darwin-amd64

      - name: Anexar binário à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.version.outputs.version }}" build/release/new-k8s-hpa-darwin-amd64 --repo "$GITHUB_REPOSITORY" --clobber

  # macos-14 = runner Apple Silicon (arm64) — build NATIVO.
  build-darwin-arm64:
    needs: [version, create-release]
    runs-on: macos-14
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend (embutido no binário via go:embed)
        run: |
          cd internal/web/frontend
          npm ci
          npm run build

      - name: Build (CGO_ENABLED=1, nativo — corrige binário com SQLite quebrado)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
        run: make release-single

      - name: Smoke-test SQLite real (não só compilação)
        run: |
          chmod +x build/release/new-k8s-hpa-darwin-arm64
          OUT=$(./build/release/new-k8s-hpa-darwin-arm64 version 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q "CGO_ENABLED=0"; then
            echo "❌ Binário compilado sem CGO real — SQLite quebrado. Abortando release." >&2
            exit 1
          fi

      - name: Anexar binário à release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "v${{ needs.version.outputs.version }}" build/release/new-k8s-hpa-darwin-arm64 --repo "$GITHUB_REPOSITORY" --clobber

  # Só depois dos 3 binários anexados: tira o rascunho e a release fica visível.
  publish:
    needs: [version, build-linux-amd64, build-darwin-amd64, build-darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      TAG: v${{ needs.version.outputs.version }}
    steps:
      - name: Conferir assets e publicar
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name'
          N=$(gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets|length')
          if [ "$N" -ne 3 ]; then echo "ERRO: esperava 3 binários na release, há $N." >&2; exit 1; fi
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest
