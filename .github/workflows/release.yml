name: Release

# Disparo manual apenas (workflow_dispatch) — NÃO dispara automaticamente em push de tag.
# Motivo: o fluxo de release documentado no CLAUDE.md (seção "Release") é manual via
# `git tag vX.Y.Z && git push origin vX.Y.Z` seguido de `gh release create` explícito.
# Um trigger automático em `push: tags: v*` corria em paralelo a esse fluxo manual e
# publicava uma release duplicada/com nomes de binário desatualizados.
# Para rodar: Actions → Release → Run workflow, escolhendo a tag desejada como "Use workflow from".
on:
  workflow_dispatch: {}

jobs:
  # Valida a tag e expõe a versão limpa (sem "v") pros demais jobs via output.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.VERSION }}
    steps:
      - name: Get version from tag
        id: version
        run: |
          if [[ "$GITHUB_REF" != refs/tags/v* ]]; then
            echo "ERRO: rode este workflow escolhendo uma tag vX.Y.Z em 'Use workflow from', não uma branch." >&2
            exit 1
          fi
          VERSION=${GITHUB_REF#refs/tags/v}
          echo "VERSION=$VERSION" >> $GITHUB_OUTPUT
          echo "Building version: $VERSION"

  # Builda o frontend UMA vez só e compartilha internal/web/static (via go:embed, o binário Go
  # embute esse diretório em build time) com os 3 jobs de build por plataforma abaixo — evita
  # rodar `npm ci && npm run build` 3x e garante que os 3 binários embutem os MESMOS assets.
  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Build frontend
        run: |
          cd internal/web/frontend
          npm ci
          npm run build

      - name: Verify static files exist
        run: |
          echo "=== Checking static files ==="
          ls -lah internal/web/static/
          ls -lah internal/web/static/assets/
          echo "=== Static files verified ==="

      - name: Upload frontend static assets
        uses: actions/upload-artifact@v4
        with:
          name: frontend-static
          path: internal/web/static/
          retention-days: 1

  build-linux-amd64:
    needs: [version, frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # necessário para `git describe` (versão embutida no binário)

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download frontend static assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: internal/web/static/

      - name: Build (CGO_ENABLED=1, nativo)
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: 1
        run: make release-single

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: release-linux-amd64
          path: build/release/new-k8s-hpa-linux-amd64
          retention-days: 1

  # macos-13 = runner Intel (x86_64) — build NATIVO, sem cross-compilation de arquitetura.
  # CGO_ENABLED=1 é o padrão do Go quando GOOS/GOARCH batem com o host, mas setamos explícito
  # pra não depender desse comportamento implícito silenciosamente mudar no futuro.
  build-darwin-amd64:
    needs: [version, frontend]
    runs-on: macos-13
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download frontend static assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: internal/web/static/

      - name: Build (CGO_ENABLED=1, nativo — corrige binário com SQLite quebrado)
        env:
          GOOS: darwin
          GOARCH: amd64
          CGO_ENABLED: 1
        run: make release-single

      - name: Smoke-test SQLite real (não só compilação)
        run: |
          # Confirma que o driver SQLite funciona de verdade neste binário — é exatamente esta
          # checagem que faltava antes e deixou um release com persistência quebrada passar
          # despercebido (ver internal/storage/sqlite_health.go).
          chmod +x build/release/new-k8s-hpa-darwin-amd64
          OUT=$(./build/release/new-k8s-hpa-darwin-amd64 version 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q "CGO_ENABLED=0"; then
            echo "❌ Binário compilado sem CGO real — SQLite quebrado. Abortando release." >&2
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-amd64
          path: build/release/new-k8s-hpa-darwin-amd64
          retention-days: 1

  # macos-14 = runner Apple Silicon (arm64) — build NATIVO.
  build-darwin-arm64:
    needs: [version, frontend]
    runs-on: macos-14
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'

      - name: Download frontend static assets
        uses: actions/download-artifact@v4
        with:
          name: frontend-static
          path: internal/web/static/

      - name: Build (CGO_ENABLED=1, nativo — corrige binário com SQLite quebrado)
        env:
          GOOS: darwin
          GOARCH: arm64
          CGO_ENABLED: 1
        run: make release-single

      - name: Smoke-test SQLite real (não só compilação)
        run: |
          chmod +x build/release/new-k8s-hpa-darwin-arm64
          OUT=$(./build/release/new-k8s-hpa-darwin-arm64 version 2>&1) || true
          echo "$OUT"
          if echo "$OUT" | grep -q "CGO_ENABLED=0"; then
            echo "❌ Binário compilado sem CGO real — SQLite quebrado. Abortando release." >&2
            exit 1
          fi

      - name: Upload binary
        uses: actions/upload-artifact@v4
        with:
          name: release-darwin-arm64
          path: build/release/new-k8s-hpa-darwin-arm64
          retention-days: 1

  publish:
    needs: [version, build-linux-amd64, build-darwin-amd64, build-darwin-arm64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all platform binaries
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: build/release
          merge-multiple: true

      - name: List binaries
        run: ls -lh build/release/

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: build/release/*
          generate_release_notes: true
          draft: false
          prerelease: false
          body: |
            ## 🚀 new-k8s-hpa ${{ needs.version.outputs.version }}

            ### 📥 Instalação

            **Linux (amd64):**
            ```bash
            curl -L https://github.com/Paulo-Ribeiro-Log/New-K8S-HPA-Manager/releases/download/v${{ needs.version.outputs.version }}/new-k8s-hpa-linux-amd64 -o new-k8s-hpa
            chmod +x new-k8s-hpa
            sudo mv new-k8s-hpa /usr/local/bin/
            ```

            **macOS (Intel):**
            ```bash
            curl -L https://github.com/Paulo-Ribeiro-Log/New-K8S-HPA-Manager/releases/download/v${{ needs.version.outputs.version }}/new-k8s-hpa-darwin-amd64 -o new-k8s-hpa
            chmod +x new-k8s-hpa
            sudo mv new-k8s-hpa /usr/local/bin/
            ```

            **macOS (Apple Silicon):**
            ```bash
            curl -L https://github.com/Paulo-Ribeiro-Log/New-K8S-HPA-Manager/releases/download/v${{ needs.version.outputs.version }}/new-k8s-hpa-darwin-arm64 -o new-k8s-hpa
            chmod +x new-k8s-hpa
            sudo mv new-k8s-hpa /usr/local/bin/
            ```

            **Windows**: Use WSL2 com o binário Linux.

            ### ✨ Verificar Instalação
            ```bash
            new-k8s-hpa version
            ```

            ---

            🤖 Release publicada manualmente via GitHub Actions (workflow_dispatch) — binários
            macOS buildados em runners nativos (macos-13 Intel / macos-14 Apple Silicon) com
            CGO_ENABLED=1 real, garantindo que a persistência SQLite (Notas, tokens de IA/Dynatrace/
            GitHub, predictions, etc.) funciona de verdade.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload artifacts (retenção 90 dias)
        uses: actions/upload-artifact@v4
        with:
          name: new-k8s-hpa-${{ needs.version.outputs.version }}
          path: build/release/*
          retention-days: 90
